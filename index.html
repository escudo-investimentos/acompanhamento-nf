<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Acompanhamento de NF-e</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg: #f6f1ef;
    --surface: #ffffff;
    --surface-2: #f3ece9;
    --border: #e4d6d1;
    --text: #2b201d;
    --text-dim: #7d6a64;
    --accent: #c23b30;
    --accent-2: #8f281f;
    --accent-soft: #f8e3e0;
    --good: #227a4d;
    --good-soft: #e2f2e8;
    --warn: #a86b0f;
    --warn-soft: #faedd6;
    --bad: #9e2a22;
    --bad-soft: #f8dcda;
    --neutral-soft: #ede4e1;
    --shadow: 0 1px 2px rgba(40,20,16,.06), 0 8px 24px -12px rgba(40,20,16,.16);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #1c1412;
      --surface: #241a17;
      --surface-2: #2c211d;
      --border: #43312b;
      --text: #f1e6e2;
      --text-dim: #b19a92;
      --accent: #e2685c;
      --accent-2: #ef8579;
      --accent-soft: #3a2420;
      --good: #7ad4a4;
      --good-soft: #1c3327;
      --warn: #e7b45f;
      --warn-soft: #3a2e18;
      --bad: #f0958b;
      --bad-soft: #3d211e;
      --neutral-soft: #322622;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg: #1c1412;
    --surface: #241a17;
    --surface-2: #2c211d;
    --border: #43312b;
    --text: #f1e6e2;
    --text-dim: #b19a92;
    --accent: #e2685c;
    --accent-2: #ef8579;
    --accent-soft: #3a2420;
    --good: #7ad4a4;
    --good-soft: #1c3327;
    --warn: #e7b45f;
    --warn-soft: #3a2e18;
    --bad: #f0958b;
    --bad-soft: #3d211e;
    --neutral-soft: #322622;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Source Sans 3", system-ui, sans-serif;
    font-size:14px; line-height:1.45;
  }
  h1,h2,h3,.display{font-family:"Manrope", system-ui, sans-serif; font-weight:800; letter-spacing:-.01em}
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums}
  button{font:inherit; cursor:pointer}
  input,select,textarea{font:inherit; color:inherit}
  a{color:var(--accent)}

  /* ---------- Layout shells ---------- */
  #app{min-height:100%; display:flex; flex-direction:column}
  .topbar{
    display:flex; align-items:center; gap:14px; justify-content:space-between;
    padding:14px 20px; background:var(--surface); border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:20;
  }
  .brand{display:flex; align-items:center; gap:10px}
  .brand .mark{
    width:36px; height:36px; border-radius:9px; overflow:hidden; flex:none; box-shadow:var(--shadow);
  }
  .brand .mark img{width:100%; height:100%; object-fit:cover; display:block}
  .brand h1{font-size:16px; margin:0}
  .brand small{display:block; color:var(--text-dim); font-size:11.5px; font-weight:500; margin-top:1px}
  .who{display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--text-dim)}
  .btn{
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    padding:8px 14px; border-radius:8px; font-weight:600; font-size:13px;
    display:inline-flex; align-items:center; gap:6px; transition:.15s border-color, .15s background;
  }
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.primary:hover{background:var(--accent-2); border-color:var(--accent-2)}
  .btn.ghost{border-color:transparent; background:transparent}
  .btn.small{padding:5px 10px; font-size:12px; border-radius:7px}
  .btn.danger{color:var(--bad)}
  .btn[disabled]{opacity:.45; cursor:not-allowed}

  main{flex:1; padding:18px 20px 60px; max-width:1400px; width:100%; margin:0 auto}

  /* ---------- Auth screen ---------- */
  .auth-wrap{
    min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .auth-card{
    width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:28px 26px; box-shadow:var(--shadow);
  }
  .auth-card .mark{width:48px;height:48px;border-radius:12px;margin-bottom:14px; overflow:hidden; flex:none}
  .auth-card .mark img{width:100%; height:100%; object-fit:cover; display:block}
  .auth-card h2{font-size:19px; margin:0 0 4px}
  .auth-card p.sub{color:var(--text-dim); margin:0 0 20px; font-size:13px}
  .field{margin-bottom:13px}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--text-dim); margin-bottom:5px}
  .field input{
    width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px;
    background:var(--surface-2); color:var(--text);
  }
  .field input:focus{outline:2px solid var(--accent); outline-offset:1px}
  .auth-toggle{margin-top:16px; text-align:center; font-size:12.5px; color:var(--text-dim)}
  .auth-toggle button{background:none;border:none;color:var(--accent);font-weight:600;padding:0}
  .auth-msg{font-size:12.5px; padding:9px 11px; border-radius:8px; margin-bottom:13px}
  .auth-msg.err{background:var(--bad-soft); color:var(--bad)}
  .auth-msg.ok{background:var(--good-soft); color:var(--good)}

  /* ---------- Stat strip ---------- */
  .stats{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:16px}
  .stat{
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px;
    display:flex; flex-direction:column; gap:2px;
  }
  .stat .n{font-family:"Manrope"; font-weight:800; font-size:22px; font-variant-numeric:tabular-nums}
  .stat .l{font-size:11.5px; color:var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:.03em}
  .stat.vencido .n{color:var(--bad)}
  .stat.acima .n{color:var(--warn)}
  .stat.semid .n{color:var(--text-dim)}

  /* ---------- Tabs / filters ---------- */
  .controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px}
  .tabs{display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:10px}
  .tab{
    border:none; background:transparent; padding:7px 13px; border-radius:7px; font-weight:600; font-size:12.5px; color:var(--text-dim);
  }
  .tab.active{background:var(--surface); color:var(--text); box-shadow:var(--shadow)}
  .tab.pagos{color:var(--good)}
  .tab.pagos.active{color:var(--good)}
  .spacer{flex:1}
  .search{
    display:flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--border);
    border-radius:8px; padding:7px 11px; min-width:220px;
  }
  .search input{border:none; background:none; width:100%; outline:none}
  select.filter{
    border:1px solid var(--border); background:var(--surface); border-radius:8px; padding:7px 10px; font-size:12.5px; font-weight:600;
  }
  .dateRange{
    display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border);
    border-radius:8px; padding:6px 10px; font-size:12px; color:var(--text-dim); font-weight:600;
  }
  .dateRange label{display:flex; align-items:center; gap:5px}
  .dateRange input[type="date"]{
    border:none; background:none; font-size:12.5px; color:var(--text); font-family:inherit; padding:2px 0;
  }
  .sugestaoTag{
    display:inline-block; margin-top:4px; font-size:10px; font-weight:700; color:var(--good);
    background:var(--good-soft); border-radius:5px; padding:2px 6px;
  }

  /* ---------- Bulk bar ---------- */
  .bulkbar{
    display:none; align-items:center; gap:8px; background:var(--accent-soft); border:1px solid var(--accent);
    padding:9px 13px; border-radius:10px; margin-bottom:12px; flex-wrap:wrap; font-size:13px;
  }
  .bulkbar.show{display:flex}
  .bulkbar strong{color:var(--accent-2)}

  /* ---------- Table ---------- */
  .table-scroll-top{overflow-x:auto; overflow-y:hidden; height:14px; margin-bottom:2px}
  .table-scroll-top-inner{height:1px}
  .table-wrap{background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:auto; box-shadow:var(--shadow)}
  table{border-collapse:collapse; width:100%; min-width:1180px}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim);
    padding:10px 12px; border-bottom:1px solid var(--border); background:var(--surface-2); position:sticky; top:0;
    white-space:nowrap;
  }
  .th-inner{display:flex; align-items:center; gap:5px}
  .filtroBtn{
    border:none; background:none; cursor:pointer; color:var(--text-dim); font-size:10px; padding:2px 4px;
    border-radius:4px; line-height:1;
  }
  .filtroBtn:hover{background:var(--surface); color:var(--text)}
  .filtroBtn.active{color:var(--accent); background:var(--accent-soft)}
  .filtroPanel{
    position:absolute; top:100%; left:0; margin-top:4px; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; box-shadow:var(--shadow); width:220px; z-index:40; padding:8px; text-transform:none;
    letter-spacing:normal; font-weight:500; color:var(--text); white-space:normal;
  }
  .filtroBusca{
    width:100%; box-sizing:border-box; border:1px solid var(--border); background:var(--bg); color:var(--text);
    border-radius:6px; padding:5px 7px; font-size:12px; margin-bottom:6px;
  }
  .filtroBusca:focus{outline:none; border-color:var(--accent)}
  .filtroAcoes{display:flex; justify-content:space-between; gap:6px; margin-bottom:6px; font-size:11px}
  .filtroAcoes button{
    border:none; background:none; color:var(--accent-2); cursor:pointer; font-weight:700; font-size:11px; padding:2px 0;
  }
  .filtroAcoes button:hover{text-decoration:underline}
  .filtroLista{max-height:220px; overflow-y:auto; border-top:1px solid var(--border); padding-top:6px}
  .filtroItem{
    display:flex; align-items:center; gap:7px; padding:4px 2px; font-size:12.5px; cursor:pointer; border-radius:5px;
  }
  .filtroItem:hover{background:var(--surface-2)}
  .filtroItem input{width:14px; height:14px; flex:none}
  .filtroItem span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .filtroVazio{color:var(--text-dim); font-size:12px; padding:6px 2px}
  tbody td{padding:9px 12px; border-bottom:1px solid var(--border); vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--surface-2)}
  tbody tr.selected{background:var(--accent-soft)}
  td.num{text-align:right}
  .doc{font-weight:700}
  .fornecedor{font-weight:600}
  .fornecedor .emp{display:block; font-weight:400; color:var(--text-dim); font-size:11.5px; margin-top:1px}
  .badge{
    display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11px; font-weight:700;
    white-space:nowrap;
  }
  .badge.ok{background:var(--good-soft); color:var(--good)}
  .badge.mid{background:var(--warn-soft); color:var(--warn)}
  .badge.hot{background:var(--bad-soft); color:var(--bad)}
  .badge.semid{background:var(--neutral-soft); color:var(--text-dim)}
  select.rowselect, input.rowtext{
    width:100%; border:1px solid transparent; background:transparent; border-radius:6px; padding:5px 6px; color:var(--text);
  }
  select.rowselect:hover, input.rowtext:hover{border-color:var(--border)}
  select.rowselect:focus, input.rowtext:focus{border-color:var(--accent); background:var(--surface-2); outline:none}
  .statuspill{border:none; border-radius:7px; padding:5px 9px; font-size:11.5px; font-weight:700; cursor:pointer}
  .statuspill.EXPORT{background:var(--accent-soft); color:var(--accent-2)}
  .statuspill.LIXO{background:var(--neutral-soft); color:var(--text-dim)}
  .statuspill.FEITO_DESCONHECIMENTO{background:var(--good-soft); color:var(--good)}
  .statuspill.NOTA_DESCONHECIDA{background:var(--warn-soft); color:var(--warn)}
  .checkbox{width:16px;height:16px}
  .empty{padding:50px 20px; text-align:center; color:var(--text-dim)}
  .empty b{display:block; color:var(--text); font-size:15px; margin-bottom:4px}
  .foot{display:flex; justify-content:space-between; align-items:center; padding:10px 4px; color:var(--text-dim); font-size:12px}
  .toast{
    position:fixed; bottom:18px; right:18px; background:var(--text); color:var(--bg); padding:10px 16px; border-radius:9px;
    font-size:13px; font-weight:600; box-shadow:var(--shadow); opacity:0; transform:translateY(8px); transition:.2s; pointer-events:none; z-index:50;
  }
  .toast.show{opacity:1; transform:translateY(0)}

  /* ---------- Modal (mailto helper) ---------- */
  .modal-bg{
    position:fixed; inset:0; background:rgba(15,22,28,.5); display:none; align-items:center; justify-content:center; z-index:60; padding:20px;
  }
  .modal-bg.show{display:flex}
  .modal{background:var(--surface); border-radius:14px; max-width:520px; width:100%; padding:22px; box-shadow:var(--shadow); max-height:82vh; overflow:auto}
  .modal h3{margin:0 0 4px}
  .modal p.sub{color:var(--text-dim); margin:0 0 16px; font-size:13px}
  .maillink{
    display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--surface-2);
    border:1px solid var(--border); border-radius:10px; padding:11px 13px; margin-bottom:9px;
  }
  .maillink .who2{font-weight:700; font-size:13px}
  .maillink .cnt{color:var(--text-dim); font-size:12px}

  @media (max-width: 860px){
    .stats{grid-template-columns:repeat(2,1fr)}
    main{padding:14px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>

function toast(msg){

   ============================================================ */
async function boot(){
  const { data } = await sb.auth.getSession();
  session = data.session;
  sb.auth.onAuthStateChange((_event, s) => {
    session = s;
    meuPerfil = null;
    render();
    if(session) loadAll(); else stopRealtime();
  });
  render();
  if(session) await loadAll();
}

function isAdminUser(){
  return !!session && (session.user.email || "").toLowerCase() === ADMIN_EMAIL.toLowerCase();
}

// unica vez -- os cliques DENTRO do botao/painel do filtro chamam

document.addEventListener("click", () => {

/* ============================================================
   DATA LOADING
   ============================================================ */
async function loadAll(){
  await loadMeuPerfil();
  // Quem ainda nao foi aprovado nao tem acesso as tabelas de notas/compradores
  // mesmo (RLS bloqueia no banco) -- nem tenta carregar, so mostra a tela de
  // espera.
  if(!isAdminUser() && meuPerfil && !meuPerfil.aprovado){
    render();
    return;
  }
  await Promise.all([loadCompradores(), loadNotas()]);
  if(isAdminUser()) await loadPendentes();
  startRealtime();
  render();
}

async function loadMeuPerfil(){
  const { data, error } = await sb.from("perfis_usuarios")
    .select("aprovado,email")
    .eq("id", session.user.id)
    .maybeSingle();
  if(error){ console.error(error); meuPerfil = { aprovado: false }; return; }
  // Se ainda nao existe linha (ex: usuario criado antes dessa funcionalidade
  // existir), trata como aprovado pra nao travar quem ja usava o site.
  meuPerfil = data || { aprovado: true };
}

async function loadPendentes(){
  const { data, error } = await sb.from("perfis_usuarios")
    .select("*")
    .eq("aprovado", false)
    .order("criado_em");
  if(error){ console.error(error); return; }
  perfisPendentes = data || [];
}

async function aprovarUsuario(id){
  const { error } = await sb.from("perfis_usuarios")
    .update({ aprovado: true, aprovado_em: new Date().toISOString(), aprovado_por: session.user.id })
    .eq("id", id);
  if(error){ toast("Erro ao aprovar: " + error.message); return; }
  toast("Usuário aprovado!");
  await loadPendentes();
  render();
}

async function loadCompradores(){
  const { data, error } = await sb.from("compradores").select("*").order("nome");
  if(error){ console.error(error); return; }
  compradores = data || [];
}

async function loadNotas(){
  // O Supabase limita a 1000 linhas por chamada -- busca em paginas ate acabar.
  const pageSize = 1000;
  let all = [];
  let from = 0;
  while(true){
    const { data, error } = await sb.from("notas_fiscais")
      .select("*")
      .order("data_emissao", { ascending: false })
      .range(from, from + pageSize - 1);
    if(error){ console.error(error); toast("Erro ao carregar notas: " + error.message); break; }
    all = all.concat(data || []);
    if(!data || data.length < pageSize) break;
    from += pageSize;
  }
  notas = all;
}

function startRealtime(){
  if(channel) return;
  channel = sb.channel("notas-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "notas_fiscais" }, () => {
      loadNotas().then(render);
    })
    .subscribe();
}
function stopRealtime(){
  if(channel){ sb.removeChannel(channel); channel = null; }
}

/* ============================================================
   HELPERS
   ============================================================ */
function diasDesde(dataStr){
  if(!dataStr) return null;
  const d = new Date(dataStr + "T00:00:00");
  const hoje = new Date();
  hoje.setHours(0,0,0,0);
  return Math.round((hoje - d) / 86400000);
}

function diasAteVencimento(nota){
  if(!nota.vencimento) return null;
  const v = new Date(nota.vencimento + "T00:00:00");
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  return Math.round((v - hoje) / 86400000);
}

// Mesma logica da planilha: quando ha vencimento identificado (vindo do
// Sienge), classifica pela data de vencimento. Quando NAO ha vencimento
// ainda (a maioria das notas, ate a fase 2 da integracao trazer isso),
// usa a idade da nota desde a emissao como aproximacao -- e sinaliza como
// "SOLICITAR DESCONHECIMENTO" quando passa de 60 dias sem resolucao.
function faixaDe(nota){
  const diasEmissao = diasDesde(nota.data_emissao);
  const diasVenc = diasAteVencimento(nota);

  if(diasVenc !== null){
    if(diasVenc < 0) return "VENCIDO";
    if(diasVenc <= 15) return "ABAIXO_15";
    if(diasVenc <= 20) return "15_A_20";
    return "ACIMA_20";
  }

  if(diasEmissao === null) return "SEM_IDENTIFICACAO";
  if(diasEmissao > 60) return "SOLICITAR_DESCONHECIMENTO";
  if(!nota.possivel_comprador || !nota.possivel_comprador.trim()) return "SEM_IDENTIFICACAO";
  if(diasEmissao < 15) return "ABAIXO_15";
  if(diasEmissao <= 20) return "15_A_20";
  return "ACIMA_20";
}

const FAIXA_META = {
  ABAIXO_15: { label: "Abaixo de 15 dias", cls: "ok" },
  "15_A_20": { label: "15 a 20 dias", cls: "mid" },
  ACIMA_20: { label: "Acima de 20 dias", cls: "hot" },
  VENCIDO: { label: "Vencido", cls: "hot" },
  SEM_IDENTIFICACAO: { label: "Sem identificação", cls: "semid" },
  SOLICITAR_DESCONHECIMENTO: { label: "Solicitar desconhecimento", cls: "hot" },
};

function fmtMoeda(v){
  if(v === null || v === undefined) return "—";
  return Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}
function fmtData(d){
  if(!d) return "—";
  const [y,m,day] = d.split("-");
  return `${day}/${m}/${y}`;
}
function statusClass(s){ return (s||"EXPORT").replace(/[^A-Z]/g,"_"); }

function compradorEmail(nome){
  if(!nome) return null;
  const hit = compradores.find(c => c.nome.trim().toUpperCase() === nome.trim().toUpperCase());
  return hit ? hit.email : null;
}

async function handleAuthSubmit(e){
  e.preventDefault();
  const email = document.getElementById("authEmail").value.trim();
  const pass = document.getElementById("authPass").value;

  if(!email.toLowerCase().endsWith("@" + EMAIL_DOMAIN)){
    authMsg = { type: "err", text: `Use seu e-mail @${EMAIL_DOMAIN}.` };
    render();
    return;
  }

  if(authMode === "login"){
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error){ authMsg = { type: "err", text: error.message }; render(); return; }
  } else {
    const { data, error } = await sb.auth.signUp({ email, password: pass });
    if(error){ authMsg = { type: "err", text: error.message }; render(); return; }
    if(!data.session){
      authMsg = { type: "ok", text: "Conta criada! Verifique seu e-mail pra confirmar antes de entrar." };
      authMode = "login";
      render();
      return;
    }
  }
}

function getTabCounts(){
  const c = {};
  notas.forEach(n => {
    if(n.pago){ c.PAGOS = (c.PAGOS||0)+1; return; }
    const s = n.status_manual || "EXPORT";
    c[s] = (c[s]||0)+1;
  });
  return c;
}

function getStats(){
  const base = notas.filter(n => (n.status_manual||"EXPORT") === "EXPORT" && !n.pago);
  let vencido=0, acima=0, semid=0, solicitarDesc=0, valor=0;
  base.forEach(n => {
    const f = faixaDe(n);
    if(f==="VENCIDO") vencido++;
    if(f==="ACIMA_20") acima++;
    if(f==="SEM_IDENTIFICACAO") semid++;
    if(f==="SOLICITAR_DESCONHECIMENTO") solicitarDesc++;
  });
  getFiltered().forEach(n => valor += Number(n.valor_total||0));
  return { total: base.length, vencido, acima, semid, solicitarDesc, valor };
}

function passaPeriodo(n){
  if(!n.data_emissao) return !dataDe && !dataAte;
  if(dataDe && n.data_emissao < dataDe) return false;
  if(dataAte && n.data_emissao > dataAte) return false;
  return true;
}

// ignorarColuna: quando informado, o filtro daquela coluna NAO e aplicado --
// usado pra calcular a lista de valores disponiveis no proprio dropdown dela
// (as opcoes se estreitam pelos OUTROS filtros ativos, ao estilo Excel).
function getFiltered({ ignorarColuna } = {}){
  return notas.filter(n => {
    if(activeTab === "PAGOS"){
      if(!n.pago) return false;
    } else {
      if(n.pago) return false;
      if((n.status_manual || "EXPORT") !== activeTab) return false;
    }
    if(activeFaixa !== "TODAS"){
      if(activeFaixa === "MAIS_DE_15_EMISSAO"){
        const d = diasDesde(n.data_emissao);
        if(d === null || d <= 15) return false;
      } else if(faixaDe(n) !== activeFaixa){
        return false;
      }
    }
    if(!passaPeriodo(n)) return false;
    if(searchTerm){
      const t = searchTerm.toLowerCase();
      const hay = `${n.numero_nf||""} ${n.fornecedor||""} ${n.possivel_comprador||""} ${n.empreendimento||""}`.toLowerCase();
      if(!hay.includes(t)) return false;
    }
    for(const c of COLUNAS){
      if(c.id === ignorarColuna) continue;
      const excluidos = columnFilters[c.id];
      if(!excluidos || !excluidos.size) continue;
      const valorCelula = String(c.valor(n) || "");
      if(excluidos.has(valorCelula)) return false;
    }
    return true;
  });
}

// Valores unicos disponiveis pra montar a lista de checkboxes do filtro de
// uma coluna, considerando os demais filtros ja ativos (progressive narrowing).
function opcoesColuna(col){
  const vistos = new Set();
  getFiltered({ ignorarColuna: col.id }).forEach(n => vistos.add(String(col.valor(n) || "")));
  return [...vistos].sort((a,b) => a.localeCompare(b, "pt-BR", { sensitivity: "base" }));
}

function renderTable(rows){

              <div class="th-inner">
                <span>${c.label}</span>
                <button type="button" class="filtroBtn ${columnFilters[c.id] && columnFilters[c.id].size ? 'active' : ''}" data-filtrocol="${c.id}" title="Filtrar ${c.label}">▾</button>
              </div>
              ${dropdownColunaAberta === c.id ? renderDropdownFiltro(c) : ""}
            </th>
          `).join("")}
        </tr>
      </thead>
      <tbody>
        ${rows.map(rowHtml).join("")}
      </tbody>
    </table>
  `;
}

function renderDropdownFiltro(col){
  const busca = dropdownBusca.toLowerCase();
  const todasOpcoes = opcoesColuna(col);
  const opcoes = busca ? todasOpcoes.filter(v => v.toLowerCase().includes(busca)) : todasOpcoes;
  const excluidos = columnFilters[col.id] || new Set();
  const todasMarcadas = opcoes.length > 0 && opcoes.every(v => !excluidos.has(v));

  return `
    <div class="filtroPanel" data-filtropanel="${col.id}">
      <input type="text" class="filtroBusca" id="filtroBusca" placeholder="Pesquisar..." value="${dropdownBusca.replace(/"/g,'&quot;')}" />
      <div class="filtroAcoes">
        <button type="button" data-filtroacao="limpar" data-col="${col.id}">Limpar filtro</button>
        <button type="button" data-filtroacao="fechar">Fechar</button>
      </div>
      <div class="filtroLista">
        ${opcoes.length ? `
          <label class="filtroItem">
            <input type="checkbox" data-filtrosel="__tudo__" data-col="${col.id}" ${todasMarcadas ? "checked" : ""} />
            <span><b>Selecionar tudo</b></span>
          </label>
          ${opcoes.map(v => `
            <label class="filtroItem">
              <input type="checkbox" data-filtrosel="${encodeURIComponent(v)}" data-col="${col.id}" ${excluidos.has(v) ? "" : "checked"} />
              <span>${(v || "<em>(vazio)</em>")}</span>
            </label>
          `).join("")}
        ` : `<div class="filtroVazio">Nenhum valor pra mostrar.</div>`}
      </div>
    </div>
  `;
}

function rowHtml(n){
  const f = faixaDe(n);
  const fm = FAIXA_META[f];
  const isSel = selected.has(n.id);
  const diasEmissao = diasDesde(n.data_emissao);
  const diasVenc = diasAteVencimento(n);
  return `
    <tr class="${isSel?'selected':''}" data-id="${n.id}">
      <td><input type="checkbox" class="checkbox rowcheck" data-id="${n.id}" ${isSel?'checked':''} /></td>
      <td class="doc mono">${n.numero_nf ?? "—"}</td>
      <td>
        <div class="fornecedor">${n.fornecedor || "—"}
          ${n.empresa ? `<span class="emp">${n.empresa}</span>` : ""}
        </div>
      </td>
      <td>${n.empreendimento || "—"}</td>
      <td class="mono">${fmtData(n.data_emissao)}</td>
      <td class="num mono">${diasEmissao === null ? "—" : diasEmissao}</td>
      <td class="mono">${n.vencimento ? fmtData(n.vencimento) : "—"}</td>
      <td class="num mono">${diasVenc === null ? "—" : diasVenc}</td>
      <td><span class="badge ${fm.cls}">${fm.label}</span></td>
      <td class="num mono">${fmtMoeda(n.valor_total)}</td>
      <td>
        <select class="rowselect" data-field="possivel_comprador" data-id="${n.id}">
          <option value="">— selecionar —</option>
          ${compradores.map(c => `<option value="${c.nome}" ${n.possivel_comprador===c.nome?'selected':''}>${c.nome}</option>`).join("")}
        </select>
        ${n.comprador_sugerido_sienge && n.possivel_comprador ? `<span class="sugestaoTag" title="Sugerido automaticamente a partir do pedido de compra no Sienge">via Sienge</span>` : ""}
      </td>
      <td>
        <input class="rowtext" type="text" data-field="observacao" data-id="${n.id}" value="${(n.observacao||"").replace(/"/g,'&quot;')}" placeholder="—" />
      </td>
      <td>
        <select class="statuspill ${statusClass(n.status_manual)}" data-field="status_manual" data-id="${n.id}">
          ${STATUS_ORDER.map(s => `<option value="${s}" ${(n.status_manual||'EXPORT')===s?'selected':''}>${STATUS_LABELS[s]}</option>`).join("")}
        </select>
      </td>
      <td class="mono">${n.pago && n.data_pagamento ? fmtData(n.data_pagamento) : "—"}</td>
    </tr>
  `;
}

/* ============================================================
   WIRING
   ============================================================ */
function wireApp(filtered){
  document.getElementById("btnLogout").onclick = async () => { await sb.auth.signOut(); selected.clear(); };
  document.getElementById("btnRefresh").onclick = async () => { await loadAll(); toast("Atualizado"); };

  document.getElementById("tabs").querySelectorAll("[data-tab]").forEach(b => {
    b.onclick = () => { activeTab = b.dataset.tab; selected.clear(); render(); };
  });
  document.getElementById("faixaFilter").onchange = (e) => { activeFaixa = e.target.value; render(); };
  document.getElementById("searchInput").oninput = (e) => { searchTerm = e.target.value; colunaFocoAtual = "__search__"; render(); };

  document.getElementById("dataDe").onchange = (e) => { dataDe = e.target.value; render(); };
  document.getElementById("dataAte").onchange = (e) => { dataAte = e.target.value; render(); };
  document.getElementById("btnLimparPeriodo")?.addEventListener("click", () => { dataDe = ""; dataAte = ""; render(); });

  // Botao "▾" de cada coluna: abre/fecha o dropdown de filtro estilo Excel.
  document.querySelectorAll("[data-filtrocol]").forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const col = btn.dataset.filtrocol;
      dropdownColunaAberta = (dropdownColunaAberta === col) ? null : col;
      dropdownBusca = "";
      colunaFocoAtual = dropdownColunaAberta ? "__filtroBusca__" : null;
      render();
    };
  });

  // Campo de pesquisa dentro do dropdown aberto (so filtra a LISTA de
  // checkboxes exibida, nao a tabela).
  const filtroBuscaEl = document.getElementById("filtroBusca");
  if(filtroBuscaEl){
    filtroBuscaEl.oninput = () => {
      dropdownBusca = filtroBuscaEl.value;
      colunaFocoAtual = "__filtroBusca__";
      render();
    };
  }

  document.querySelectorAll("[data-filtroacao]").forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const acao = btn.dataset.filtroacao;
      if(acao === "limpar"){
        const col = btn.dataset.col;
        delete columnFilters[col];
        dropdownColunaAberta = null;
        dropdownBusca = "";
      } else if(acao === "fechar"){
        dropdownColunaAberta = null;
        dropdownBusca = "";
      }
      colunaFocoAtual = null;
      render();
    };
  });

  // Checkbox "Selecionar tudo" e checkboxes individuais de cada valor: o
  // Set guardado e' o de valores EXCLUIDOS (desmarcados).
  document.querySelectorAll("[data-filtrosel]").forEach(cb => {
    cb.onclick = (e) => e.stopPropagation();
    cb.onchange = () => {
      const col = cb.dataset.col;
      const c = COLUNAS.find(x => x.id === col);
      if(!c) return;
      if(!columnFilters[col]) columnFilters[col] = new Set();
      const excluidos = columnFilters[col];

      if(cb.dataset.filtrosel === "__tudo__"){
        const opcoesVisiveis = opcoesColuna(c).filter(v =>
          !dropdownBusca || v.toLowerCase().includes(dropdownBusca.toLowerCase())
        );
        if(cb.checked) opcoesVisiveis.forEach(v => excluidos.delete(v));
        else opcoesVisiveis.forEach(v => excluidos.add(v));
      } else {
        const valor = decodeURIComponent(cb.dataset.filtrosel);
        if(cb.checked) excluidos.delete(valor);
        else excluidos.add(valor);
      }
      if(!excluidos.size) delete columnFilters[col];
      colunaFocoAtual = "__filtroBusca__";
      render();
    };
  });

  // Restaura o foco no campo que estava sendo digitado (senao, a cada
  // tecla o re-render tiraria o foco do usuario).
  if(colunaFocoAtual === "__search__"){
    const si = document.getElementById("searchInput");
    si.focus();
    si.setSelectionRange(si.value.length, si.value.length);
  } else if(colunaFocoAtual === "__filtroBusca__"){
    const fb = document.getElementById("filtroBusca");
    if(fb){ fb.focus(); fb.setSelectionRange(fb.value.length, fb.value.length); }
  } else {
    const si = document.getElementById("searchInput");
    si.focus();
    si.setSelectionRange(si.value.length, si.value.length);
  }

  const checkAll = document.getElementById("checkAll");
  if(checkAll){
    checkAll.checked = filtered.length>0 && filtered.every(n => selected.has(n.id));
    checkAll.onchange = () => {
      if(checkAll.checked) filtered.forEach(n => selected.add(n.id));
      else filtered.forEach(n => selected.delete(n.id));
      render();
    };
  }

  document.querySelectorAll(".rowcheck").forEach(cb => {
    cb.onchange = () => {
      const id = Number(cb.dataset.id);
      if(cb.checked) selected.add(id); else selected.delete(id);
      render();
    };
  });

  document.querySelectorAll("[data-field]").forEach(el => {
    const evt = el.tagName === "SELECT" ? "change" : "blur";
    el.addEventListener(evt, () => saveField(Number(el.dataset.id), el.dataset.field, el.value));
    if(el.tagName === "INPUT"){
      el.addEventListener("keydown", (e) => { if(e.key === "Enter") el.blur(); });
    }
  });

  document.getElementById("bulkbar")?.querySelectorAll("[data-bulk]").forEach(b => {
    b.onclick = () => bulkSetStatus(b.dataset.bulk);
  });

  document.getElementById("btnCobranca")?.addEventListener("click", openCobrancaModal);

  // Barra de rolagem horizontal duplicada em cima da tabela, sincronizada
  // com a rolagem real -- assim nao precisa descer ate embaixo pra rolar
  // os lados numa tabela com muita coluna.
  const scrollTop = document.getElementById("tableScrollTop");
  const scrollTopInner = document.getElementById("tableScrollTopInner");
  const tableWrap = document.getElementById("tableWrap");
  const table = tableWrap?.querySelector("table");
  if(scrollTop && scrollTopInner && tableWrap && table){
    scrollTopInner.style.width = table.scrollWidth + "px";
    let sincronizando = false;
    scrollTop.onscroll = () => {
      if(sincronizando) return;
      sincronizando = true;
      tableWrap.scrollLeft = scrollTop.scrollLeft;
      sincronizando = false;
    };
    tableWrap.onscroll = () => {
      if(sincronizando) return;
      sincronizando = true;
      scrollTop.scrollLeft = tableWrap.scrollLeft;
      sincronizando = false;
    };
  }
}

async function saveField(id, field, value){
  const patch = { [field]: value, atualizado_em: new Date().toISOString() };
  // Se alguem troca manualmente o comprador sugerido pelo Sienge, marca como
  // manual pra o sync.py nao sobrescrever essa correcao na proxima rodada.
  if(field === "possivel_comprador") patch.comprador_sugerido_sienge = false;
  const nota = notas.find(n => n.id === id);
  if(nota) Object.assign(nota, patch); // otimista
  const { error } = await sb.from("notas_fiscais").update(patch).eq("id", id);
  if(error){ toast("Erro ao salvar: " + error.message); }
  else toast("Salvo");
  render();
}

async function bulkSetStatus(status){
  const ids = [...selected];
  if(!ids.length) return;
  const { error } = await sb.from("notas_fiscais")
    .update({ status_manual: status, atualizado_em: new Date().toISOString() })
    .in("id", ids);
  if(error){ toast("Erro: " + error.message); return; }
  notas.forEach(n => { if(ids.includes(n.id)) n.status_manual = status; });
  selected.clear();
  toast(`${ids.length} nota(s) movida(s)`);
  render();
}

/* ============================================================
   COBRANÇA (mailto)
   ============================================================ */
function openCobrancaModal(){
  const ids = [...selected];
  const rows = notas.filter(n => ids.includes(n.id));
  const groups = {};
  const semComprador = [];

  rows.forEach(n => {
    const email = compradorEmail(n.possivel_comprador);
    if(!email){ semComprador.push(n); return; }
    groups[n.possivel_comprador] = groups[n.possivel_comprador] || { email, notas: [] };
    groups[n.possivel_comprador].notas.push(n);
  });

  const modal = document.getElementById("modalBody");
  const groupKeys = Object.keys(groups);

  modal.innerHTML = `
    <h3>Disparar e-mail de cobrança</h3>
    <p class="sub">Um e-mail será montado por comprador, com cópia pra compras e financeiro. "Abrir no Outlook Web" abre já pronto numa aba do navegador, na conta que você já usa lá.</p>
    ${groupKeys.length ? groupKeys.map(nome => `
      <div class="maillink">
        <div>
          <div class="who2">${nome}</div>
          <div class="cnt">${groups[nome].notas.length} nota(s) · ${groups[nome].email}</div>
        </div>
        <div style="display:flex; gap:8px; flex:none">
          <a class="btn small primary" href="${buildOutlookWebLink(groups[nome].email, groups[nome].notas)}" target="_blank" rel="noopener">Abrir no Outlook Web</a>
          <a class="btn small ghost" href="${buildMailto(groups[nome].email, groups[nome].notas)}" title="Abrir no app de e-mail padrão do computador">app de e-mail</a>
        </div>
      </div>
    `).join("") : `<p style="color:var(--text-dim); font-size:13px">Nenhuma nota selecionada tem um comprador com e-mail cadastrado.</p>`}
    ${semComprador.length ? `
      <p style="font-size:12.5px; color:var(--text-dim); margin-top:14px">
        ${semComprador.length} nota(s) selecionada(s) sem "possível comprador" definido — atribua um comprador na tabela antes de cobrar.
      </p>` : ""}
    <div style="text-align:right; margin-top:16px">
      <button class="btn" id="closeModal">Fechar</button>
    </div>
  `;
  document.getElementById("closeModal").onclick = closeModal;
  document.getElementById("modalBg").classList.add("show");
}

function cobrancaTexto(rows){
  const subject = `Cobrança de identificação – ${rows.length} nota(s) fiscal(is) pendente(s)`;
  const linhas = rows.map(n =>
    `• NF ${n.numero_nf} — ${n.fornecedor || "fornecedor não identificado"} — emitida em ${fmtData(n.data_emissao)} — ${fmtMoeda(n.valor_total)}`
  ).join("\n");
  const body = `Olá,\n\nAs notas fiscais abaixo estão pendentes de identificação/tratamento:\n\n${linhas}\n\nPor favor, verificar e retornar o quanto antes.\n\nObrigado.`;
  return { subject, body };
}

// Link direto pro Outlook na Web (outlook.office.com), que abre a
// composição de e-mail numa aba do navegador, ja logado na conta que o
// usuario usa no navegador/PWA -- evita o mailto:, que no Windows costuma
// abrir o app "novo Outlook" mesmo quando ele nao esta configurado com a
// conta correta.
function buildOutlookWebLink(to, rows){
  const { subject, body } = cobrancaTexto(rows);
  const params = new URLSearchParams({
    to, cc: CC_EMAILS.join(","), subject, body,
  });
  return `https://outlook.office.com/mail/deeplink/compose?${params.toString()}`;
}

// Fallback: mailto tradicional, pro caso do usuario preferir o app de
// e-mail padrão do computador (Outlook desktop, Mail, etc.).
function buildMailto(to, rows){
  const { subject, body } = cobrancaTexto(rows);
  const params = new URLSearchParams({ subject, body, cc: CC_EMAILS.join(",") });
  return `mailto:${encodeURIComponent(to)}?${params.toString()}`;
}

function closeModal(){ document.getElementById("modalBg").classList.remove("show"); }
document.getElementById("modalBg").addEventListener("click", (e) => { if(e.target.id === "modalBg") closeModal(); });
</script>
