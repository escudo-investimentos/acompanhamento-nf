<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Acompanhamento de NF-e</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg: #f4f6f8;
    --surface: #ffffff;
    --surface-2: #eef1f4;
    --border: #dbe1e7;
    --text: #1c2733;
    --text-dim: #5b6b7a;
    --accent: #245b73;
    --accent-2: #1c485c;
    --accent-soft: #e4eef2;
    --good: #1f7a4d;
    --good-soft: #e4f4ec;
    --warn: #a9670f;
    --warn-soft: #fbecd6;
    --bad: #b1332b;
    --bad-soft: #fae3e1;
    --neutral-soft: #eceff2;
    --shadow: 0 1px 2px rgba(20,30,40,.06), 0 8px 24px -12px rgba(20,30,40,.12);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #141a20;
      --surface: #1b232b;
      --surface-2: #212b34;
      --border: #303c47;
      --text: #e7edf2;
      --text-dim: #93a3b1;
      --accent: #6fb3cf;
      --accent-2: #8ec7dd;
      --accent-soft: #223540;
      --good: #6fceA0;
      --good-soft: #1b3329;
      --warn: #e7b45f;
      --warn-soft: #3a2e18;
      --bad: #ec8f88;
      --bad-soft: #3a201e;
      --neutral-soft: #26313b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg: #141a20;
    --surface: #1b232b;
    --surface-2: #212b34;
    --border: #303c47;
    --text: #e7edf2;
    --text-dim: #93a3b1;
    --accent: #6fb3cf;
    --accent-2: #8ec7dd;
    --accent-soft: #223540;
    --good: #6fceA0;
    --good-soft: #1b3329;
    --warn: #e7b45f;
    --warn-soft: #3a2e18;
    --bad: #ec8f88;
    --bad-soft: #3a201e;
    --neutral-soft: #26313b;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Source Sans 3", system-ui, sans-serif;
    font-size:14px; line-height:1.45;
  }
  h1,h2,h3,.display{font-family:"Manrope", system-ui, sans-serif; font-weight:800; letter-spacing:-.01em}
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums}
  button{font:inherit; cursor:pointer}
  input,select,textarea{font:inherit; color:inherit}
  a{color:var(--accent)}

  /* ---------- Layout shells ---------- */
  #app{min-height:100%; display:flex; flex-direction:column}
  .topbar{
    display:flex; align-items:center; gap:14px; justify-content:space-between;
    padding:14px 20px; background:var(--surface); border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:20;
  }
  .brand{display:flex; align-items:center; gap:10px}
  .brand .mark{
    width:34px; height:34px; border-radius:9px; background:linear-gradient(155deg, var(--accent), var(--accent-2));
    display:flex; align-items:center; justify-content:center; color:#fff; font-family:"Manrope"; font-weight:800; font-size:15px;
    flex:none;
  }
  .brand h1{font-size:16px; margin:0}
  .brand small{display:block; color:var(--text-dim); font-size:11.5px; font-weight:500; margin-top:1px}
  .who{display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--text-dim)}
  .btn{
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    padding:8px 14px; border-radius:8px; font-weight:600; font-size:13px;
    display:inline-flex; align-items:center; gap:6px; transition:.15s border-color, .15s background;
  }
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.primary:hover{background:var(--accent-2); border-color:var(--accent-2)}
  .btn.ghost{border-color:transparent; background:transparent}
  .btn.small{padding:5px 10px; font-size:12px; border-radius:7px}
  .btn.danger{color:var(--bad)}
  .btn[disabled]{opacity:.45; cursor:not-allowed}

  main{flex:1; padding:18px 20px 60px; max-width:1400px; width:100%; margin:0 auto}

  /* ---------- Auth screen ---------- */
  .auth-wrap{
    min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .auth-card{
    width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:28px 26px; box-shadow:var(--shadow);
  }
  .auth-card .mark{width:42px;height:42px;border-radius:11px;font-size:18px;margin-bottom:14px}
  .auth-card h2{font-size:19px; margin:0 0 4px}
  .auth-card p.sub{color:var(--text-dim); margin:0 0 20px; font-size:13px}
  .field{margin-bottom:13px}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--text-dim); margin-bottom:5px}
  .field input{
    width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px;
    background:var(--surface-2); color:var(--text);
  }
  .field input:focus{outline:2px solid var(--accent); outline-offset:1px}
  .auth-toggle{margin-top:16px; text-align:center; font-size:12.5px; color:var(--text-dim)}
  .auth-toggle button{background:none;border:none;color:var(--accent);font-weight:600;padding:0}
  .auth-msg{font-size:12.5px; padding:9px 11px; border-radius:8px; margin-bottom:13px}
  .auth-msg.err{background:var(--bad-soft); color:var(--bad)}
  .auth-msg.ok{background:var(--good-soft); color:var(--good)}

  /* ---------- Stat strip ---------- */
  .stats{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:16px}
  .stat{
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px;
    display:flex; flex-direction:column; gap:2px;
  }
  .stat .n{font-family:"Manrope"; font-weight:800; font-size:22px; font-variant-numeric:tabular-nums}
  .stat .l{font-size:11.5px; color:var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:.03em}
  .stat.vencido .n{color:var(--bad)}
  .stat.acima .n{color:var(--warn)}
  .stat.semid .n{color:var(--text-dim)}

  /* ---------- Tabs / filters ---------- */
  .controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px}
  .tabs{display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:10px}
  .tab{
    border:none; background:transparent; padding:7px 13px; border-radius:7px; font-weight:600; font-size:12.5px; color:var(--text-dim);
  }
  .tab.active{background:var(--surface); color:var(--text); box-shadow:var(--shadow)}
  .spacer{flex:1}
  .search{
    display:flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--border);
    border-radius:8px; padding:7px 11px; min-width:220px;
  }
  .search input{border:none; background:none; width:100%; outline:none}
  select.filter{
    border:1px solid var(--border); background:var(--surface); border-radius:8px; padding:7px 10px; font-size:12.5px; font-weight:600;
  }

  /* ---------- Bulk bar ---------- */
  .bulkbar{
    display:none; align-items:center; gap:8px; background:var(--accent-soft); border:1px solid var(--accent);
    padding:9px 13px; border-radius:10px; margin-bottom:12px; flex-wrap:wrap; font-size:13px;
  }
  .bulkbar.show{display:flex}
  .bulkbar strong{color:var(--accent-2)}

  /* ---------- Table ---------- */
  .table-wrap{background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:auto; box-shadow:var(--shadow)}
  table{border-collapse:collapse; width:100%; min-width:1180px}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim);
    padding:10px 12px; border-bottom:1px solid var(--border); background:var(--surface-2); position:sticky; top:0;
    white-space:nowrap;
  }
  tbody td{padding:9px 12px; border-bottom:1px solid var(--border); vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--surface-2)}
  tbody tr.selected{background:var(--accent-soft)}
  td.num{text-align:right}
  .doc{font-weight:700}
  .fornecedor{font-weight:600}
  .fornecedor .emp{display:block; font-weight:400; color:var(--text-dim); font-size:11.5px; margin-top:1px}
  .badge{
    display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11px; font-weight:700;
    white-space:nowrap;
  }
  .badge.ok{background:var(--good-soft); color:var(--good)}
  .badge.mid{background:var(--warn-soft); color:var(--warn)}
  .badge.hot{background:var(--bad-soft); color:var(--bad)}
  .badge.semid{background:var(--neutral-soft); color:var(--text-dim)}
  select.rowselect, input.rowtext{
    width:100%; border:1px solid transparent; background:transparent; border-radius:6px; padding:5px 6px; color:var(--text);
  }
  select.rowselect:hover, input.rowtext:hover{border-color:var(--border)}
  select.rowselect:focus, input.rowtext:focus{border-color:var(--accent); background:var(--surface-2); outline:none}
  .statuspill{border:none; border-radius:7px; padding:5px 9px; font-size:11.5px; font-weight:700; cursor:pointer}
  .statuspill.EXPORT{background:var(--accent-soft); color:var(--accent-2)}
  .statuspill.LIXO{background:var(--neutral-soft); color:var(--text-dim)}
  .statuspill.FEITO_DESCONHECIMENTO{background:var(--good-soft); color:var(--good)}
  .statuspill.NOTA_DESCONHECIDA{background:var(--warn-soft); color:var(--warn)}
  .checkbox{width:16px;height:16px}
  .empty{padding:50px 20px; text-align:center; color:var(--text-dim)}
  .empty b{display:block; color:var(--text); font-size:15px; margin-bottom:4px}
  .foot{display:flex; justify-content:space-between; align-items:center; padding:10px 4px; color:var(--text-dim); font-size:12px}
  .toast{
    position:fixed; bottom:18px; right:18px; background:var(--text); color:var(--bg); padding:10px 16px; border-radius:9px;
    font-size:13px; font-weight:600; box-shadow:var(--shadow); opacity:0; transform:translateY(8px); transition:.2s; pointer-events:none; z-index:50;
  }
  .toast.show{opacity:1; transform:translateY(0)}

  /* ---------- Modal (mailto helper) ---------- */
  .modal-bg{
    position:fixed; inset:0; background:rgba(15,22,28,.5); display:none; align-items:center; justify-content:center; z-index:60; padding:20px;
  }
  .modal-bg.show{display:flex}
  .modal{background:var(--surface); border-radius:14px; max-width:520px; width:100%; padding:22px; box-shadow:var(--shadow); max-height:82vh; overflow:auto}
  .modal h3{margin:0 0 4px}
  .modal p.sub{color:var(--text-dim); margin:0 0 16px; font-size:13px}
  .maillink{
    display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--surface-2);
    border:1px solid var(--border); border-radius:10px; padding:11px 13px; margin-bottom:9px;
  }
  .maillink .who2{font-weight:700; font-size:13px}
  .maillink .cnt{color:var(--text-dim); font-size:12px}

  @media (max-width: 860px){
    .stats{grid-template-columns:repeat(2,1fr)}
    main{padding:14px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const SUPABASE_URL = "https://qvuvyaoaurfbutvipobz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_e75Dd_wX1uzXGDmC0ePV0A_QwHJRKy2";
const EMAIL_DOMAIN = "construtoraescudo.com.br";
const CC_EMAILS = ["compras@construtoraescudo.com.br", "financeiro@construtoraescudo.com.br"];

const STATUS_LABELS = {
  EXPORT: "Em acompanhamento",
  LIXO: "Lixo",
  FEITO_DESCONHECIMENTO: "Feito desconhecimento",
  NOTA_DESCONHECIDA: "Nota desconhecida",
};
const STATUS_ORDER = ["EXPORT", "NOTA_DESCONHECIDA", "FEITO_DESCONHECIMENTO", "LIXO"];

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================================================
   STATE
   ============================================================ */
let session = null;
let notas = [];
let compradores = [];
let activeTab = "EXPORT";
let activeFaixa = "TODAS";
let searchTerm = "";
let selected = new Set();
let channel = null;

const app = document.getElementById("app");
const toastEl = document.getElementById("toast");

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(()=> toastEl.classList.remove("show"), 2600);
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  const { data } = await sb.auth.getSession();
  session = data.session;
  sb.auth.onAuthStateChange((_event, s) => {
    session = s;
    render();
    if(session) loadAll(); else stopRealtime();
  });
  render();
  if(session) await loadAll();
}
boot();

/* ============================================================
   DATA LOADING
   ============================================================ */
async function loadAll(){
  await Promise.all([loadCompradores(), loadNotas()]);
  startRealtime();
  render();
}

async function loadCompradores(){
  const { data, error } = await sb.from("compradores").select("*").order("nome");
  if(error){ console.error(error); return; }
  compradores = data || [];
}

async function loadNotas(){
  const { data, error } = await sb.from("notas_fiscais").select("*").order("data_emissao", { ascending: false });
  if(error){ console.error(error); toast("Erro ao carregar notas: " + error.message); return; }
  notas = data || [];
}

function startRealtime(){
  if(channel) return;
  channel = sb.channel("notas-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "notas_fiscais" }, () => {
      loadNotas().then(render);
    })
    .subscribe();
}
function stopRealtime(){
  if(channel){ sb.removeChannel(channel); channel = null; }
}

/* ============================================================
   HELPERS
   ============================================================ */
function diasDesde(dataStr){
  if(!dataStr) return null;
  const d = new Date(dataStr + "T00:00:00");
  const hoje = new Date();
  hoje.setHours(0,0,0,0);
  return Math.round((hoje - d) / 86400000);
}

function faixaDe(nota){
  const dias = diasDesde(nota.data_emissao);
  if(nota.vencimento){
    const v = new Date(nota.vencimento + "T00:00:00");
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    if(v < hoje) return "VENCIDO";
  }
  if(!nota.possivel_comprador || !nota.possivel_comprador.trim()) return "SEM_IDENTIFICACAO";
  if(dias === null) return "SEM_IDENTIFICACAO";
  if(dias < 15) return "ABAIXO_15";
  if(dias <= 20) return "15_A_20";
  return "ACIMA_20";
}

const FAIXA_META = {
  ABAIXO_15: { label: "Abaixo de 15 dias", cls: "ok" },
  "15_A_20": { label: "15 a 20 dias", cls: "mid" },
  ACIMA_20: { label: "Acima de 20 dias", cls: "hot" },
  VENCIDO: { label: "Vencido", cls: "hot" },
  SEM_IDENTIFICACAO: { label: "Sem identificação", cls: "semid" },
};

function fmtMoeda(v){
  if(v === null || v === undefined) return "—";
  return Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}
function fmtData(d){
  if(!d) return "—";
  const [y,m,day] = d.split("-");
  return `${day}/${m}/${y}`;
}
function statusClass(s){ return (s||"EXPORT").replace(/[^A-Z]/g,"_"); }

function compradorEmail(nome){
  if(!nome) return null;
  const hit = compradores.find(c => c.nome.trim().toUpperCase() === nome.trim().toUpperCase());
  return hit ? hit.email : null;
}

/* ============================================================
   RENDER — router
   ============================================================ */
function render(){
  if(!session){ renderAuth(); return; }
  renderApp();
}

let authMode = "login";
let authMsg = null;

function renderAuth(){
  app.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="mark">NF</div>
        <h2>${authMode === "login" ? "Entrar" : "Criar conta"}</h2>
        <p class="sub">Acompanhamento de Notas Fiscais — Construtora Escudo</p>
        ${authMsg ? `<div class="auth-msg ${authMsg.type}">${authMsg.text}</div>` : ""}
        <form id="authForm">
          <div class="field">
            <label>E-mail corporativo</label>
            <input type="email" id="authEmail" placeholder="nome.sobrenome@${EMAIL_DOMAIN}" required />
          </div>
          <div class="field">
            <label>Senha</label>
            <input type="password" id="authPass" placeholder="mínimo 6 caracteres" minlength="6" required />
          </div>
          <button class="btn primary" style="width:100%; justify-content:center" type="submit">
            ${authMode === "login" ? "Entrar" : "Criar minha conta"}
          </button>
        </form>
        <div class="auth-toggle">
          ${authMode === "login"
            ? `Ainda não tem conta? <button id="toSignup">Criar conta</button>`
            : `Já tem conta? <button id="toLogin">Entrar</button>`}
        </div>
      </div>
    </div>
  `;
  document.getElementById("authForm").onsubmit = handleAuthSubmit;
  const su = document.getElementById("toSignup");
  const sl = document.getElementById("toLogin");
  if(su) su.onclick = () => { authMode = "signup"; authMsg = null; render(); };
  if(sl) sl.onclick = () => { authMode = "login"; authMsg = null; render(); };
}

async function handleAuthSubmit(e){
  e.preventDefault();
  const email = document.getElementById("authEmail").value.trim();
  const pass = document.getElementById("authPass").value;

  if(!email.toLowerCase().endsWith("@" + EMAIL_DOMAIN)){
    authMsg = { type: "err", text: `Use seu e-mail @${EMAIL_DOMAIN}.` };
    render();
    return;
  }

  if(authMode === "login"){
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error){ authMsg = { type: "err", text: error.message }; render(); return; }
  } else {
    const { data, error } = await sb.auth.signUp({ email, password: pass });
    if(error){ authMsg = { type: "err", text: error.message }; render(); return; }
    if(!data.session){
      authMsg = { type: "ok", text: "Conta criada! Verifique seu e-mail pra confirmar antes de entrar." };
      authMode = "login";
      render();
      return;
    }
  }
}

/* ============================================================
   MAIN APP
   ============================================================ */
function renderApp(){
  const filtered = getFiltered();
  const counts = getTabCounts();
  const stats = getStats();

  app.innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="mark">NF</div>
        <div>
          <h1>Acompanhamento de NF-e</h1>
          <small>Construtora Escudo</small>
        </div>
      </div>
      <div class="who">
        <span>${session.user.email}</span>
        <button class="btn small ghost" id="btnRefresh" title="Atualizar">↻ Atualizar</button>
        <button class="btn small" id="btnLogout">Sair</button>
      </div>
    </div>
    <main>
      <div class="stats">
        <div class="stat"><div class="n mono">${stats.total}</div><div class="l">Em acompanhamento</div></div>
        <div class="stat vencido"><div class="n mono">${stats.vencido}</div><div class="l">Vencidas</div></div>
        <div class="stat acima"><div class="n mono">${stats.acima}</div><div class="l">Acima de 20 dias</div></div>
        <div class="stat semid"><div class="n mono">${stats.semid}</div><div class="l">Sem identificação</div></div>
        <div class="stat"><div class="n mono">${fmtMoeda(stats.valor)}</div><div class="l">Valor total (aba atual)</div></div>
      </div>

      <div class="controls">
        <div class="tabs" id="tabs">
          ${STATUS_ORDER.map(s => `
            <button class="tab ${activeTab===s?'active':''}" data-tab="${s}">
              ${STATUS_LABELS[s]} · ${counts[s]||0}
            </button>`).join("")}
        </div>
        <select class="filter" id="faixaFilter">
          <option value="TODAS" ${activeFaixa==='TODAS'?'selected':''}>Todas as urgências</option>
          <option value="VENCIDO" ${activeFaixa==='VENCIDO'?'selected':''}>Vencido</option>
          <option value="ACIMA_20" ${activeFaixa==='ACIMA_20'?'selected':''}>Acima de 20 dias</option>
          <option value="15_A_20" ${activeFaixa==='15_A_20'?'selected':''}>15 a 20 dias</option>
          <option value="ABAIXO_15" ${activeFaixa==='ABAIXO_15'?'selected':''}>Abaixo de 15 dias</option>
          <option value="SEM_IDENTIFICACAO" ${activeFaixa==='SEM_IDENTIFICACAO'?'selected':''}>Sem identificação</option>
        </select>
        <div class="spacer"></div>
        <div class="search">
          🔎 <input id="searchInput" placeholder="Buscar nº, fornecedor..." value="${searchTerm}" />
        </div>
      </div>

      <div class="bulkbar ${selected.size ? 'show':''}" id="bulkbar">
        <strong>${selected.size}</strong> selecionada(s)
        <button class="btn small" data-bulk="EXPORT">Voltar p/ acompanhamento</button>
        <button class="btn small" data-bulk="NOTA_DESCONHECIDA">Marcar nota desconhecida</button>
        <button class="btn small" data-bulk="FEITO_DESCONHECIMENTO">Marcar feito desconhecimento</button>
        <button class="btn small danger" data-bulk="LIXO">Mover p/ lixo</button>
        <div class="spacer"></div>
        <button class="btn small primary" id="btnCobranca">✉ Disparar cobrança</button>
      </div>

      <div class="table-wrap">
        ${filtered.length ? renderTable(filtered) : `
          <div class="empty">
            <b>Nada por aqui</b>
            Nenhuma nota encontrada com os filtros atuais.
          </div>`}
      </div>
      <div class="foot">
        <span>${filtered.length} nota(s) exibida(s)</span>
        <span>Sincronizado automaticamente com o Sienge</span>
      </div>
    </main>
  `;

  wireApp(filtered);
}

function getTabCounts(){
  const c = {};
  notas.forEach(n => { const s = n.status_manual || "EXPORT"; c[s] = (c[s]||0)+1; });
  return c;
}

function getStats(){
  const base = notas.filter(n => (n.status_manual||"EXPORT") === "EXPORT");
  let vencido=0, acima=0, semid=0, valor=0;
  base.forEach(n => {
    const f = faixaDe(n);
    if(f==="VENCIDO") vencido++;
    if(f==="ACIMA_20") acima++;
    if(f==="SEM_IDENTIFICACAO") semid++;
  });
  getFiltered().forEach(n => valor += Number(n.valor_total||0));
  return { total: base.length, vencido, acima, semid, valor };
}

function getFiltered(){
  return notas.filter(n => {
    if((n.status_manual || "EXPORT") !== activeTab) return false;
    if(activeFaixa !== "TODAS" && faixaDe(n) !== activeFaixa) return false;
    if(searchTerm){
      const t = searchTerm.toLowerCase();
      const hay = `${n.numero_nf||""} ${n.fornecedor||""} ${n.possivel_comprador||""}`.toLowerCase();
      if(!hay.includes(t)) return false;
    }
    return true;
  });
}

function renderTable(rows){
  return `
    <table>
      <thead>
        <tr>
          <th style="width:34px"><input type="checkbox" class="checkbox" id="checkAll" /></th>
          <th>Nº NF</th>
          <th>Fornecedor</th>
          <th>Emissão</th>
          <th>Urgência</th>
          <th class="num">Valor</th>
          <th style="width:170px">Possível comprador</th>
          <th style="width:220px">Observação</th>
          <th style="width:150px">Status</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(rowHtml).join("")}
      </tbody>
    </table>
  `;
}

function rowHtml(n){
  const f = faixaDe(n);
  const fm = FAIXA_META[f];
  const isSel = selected.has(n.id);
  return `
    <tr class="${isSel?'selected':''}" data-id="${n.id}">
      <td><input type="checkbox" class="checkbox rowcheck" data-id="${n.id}" ${isSel?'checked':''} /></td>
      <td class="doc mono">${n.numero_nf ?? "—"}</td>
      <td>
        <div class="fornecedor">${n.fornecedor || "—"}
          ${n.empresa ? `<span class="emp">${n.empresa}</span>` : ""}
        </div>
      </td>
      <td class="mono">${fmtData(n.data_emissao)}</td>
      <td><span class="badge ${fm.cls}">${fm.label}</span></td>
      <td class="num mono">${fmtMoeda(n.valor_total)}</td>
      <td>
        <select class="rowselect" data-field="possivel_comprador" data-id="${n.id}">
          <option value="">— selecionar —</option>
          ${compradores.map(c => `<option value="${c.nome}" ${n.possivel_comprador===c.nome?'selected':''}>${c.nome}</option>`).join("")}
        </select>
      </td>
      <td>
        <input class="rowtext" type="text" data-field="observacao" data-id="${n.id}" value="${(n.observacao||"").replace(/"/g,'&quot;')}" placeholder="—" />
      </td>
      <td>
        <select class="statuspill ${statusClass(n.status_manual)}" data-field="status_manual" data-id="${n.id}">
          ${STATUS_ORDER.map(s => `<option value="${s}" ${(n.status_manual||'EXPORT')===s?'selected':''}>${STATUS_LABELS[s]}</option>`).join("")}
        </select>
      </td>
    </tr>
  `;
}

/* ============================================================
   WIRING
   ============================================================ */
function wireApp(filtered){
  document.getElementById("btnLogout").onclick = async () => { await sb.auth.signOut(); selected.clear(); };
  document.getElementById("btnRefresh").onclick = async () => { await loadAll(); toast("Atualizado"); };

  document.getElementById("tabs").querySelectorAll("[data-tab]").forEach(b => {
    b.onclick = () => { activeTab = b.dataset.tab; selected.clear(); render(); };
  });
  document.getElementById("faixaFilter").onchange = (e) => { activeFaixa = e.target.value; render(); };
  document.getElementById("searchInput").oninput = (e) => { searchTerm = e.target.value; render(); };
  document.getElementById("searchInput").focus();
  const si = document.getElementById("searchInput");
  si.setSelectionRange(si.value.length, si.value.length);

  const checkAll = document.getElementById("checkAll");
  if(checkAll){
    checkAll.checked = filtered.length>0 && filtered.every(n => selected.has(n.id));
    checkAll.onchange = () => {
      if(checkAll.checked) filtered.forEach(n => selected.add(n.id));
      else filtered.forEach(n => selected.delete(n.id));
      render();
    };
  }

  document.querySelectorAll(".rowcheck").forEach(cb => {
    cb.onchange = () => {
      const id = Number(cb.dataset.id);
      if(cb.checked) selected.add(id); else selected.delete(id);
      render();
    };
  });

  document.querySelectorAll("[data-field]").forEach(el => {
    const evt = el.tagName === "SELECT" ? "change" : "blur";
    el.addEventListener(evt, () => saveField(Number(el.dataset.id), el.dataset.field, el.value));
    if(el.tagName === "INPUT"){
      el.addEventListener("keydown", (e) => { if(e.key === "Enter") el.blur(); });
    }
  });

  document.getElementById("bulkbar")?.querySelectorAll("[data-bulk]").forEach(b => {
    b.onclick = () => bulkSetStatus(b.dataset.bulk);
  });

  document.getElementById("btnCobranca")?.addEventListener("click", openCobrancaModal);
}

async function saveField(id, field, value){
  const patch = { [field]: value, atualizado_em: new Date().toISOString() };
  const nota = notas.find(n => n.id === id);
  if(nota) nota[field] = value; // otimista
  const { error } = await sb.from("notas_fiscais").update(patch).eq("id", id);
  if(error){ toast("Erro ao salvar: " + error.message); }
  else toast("Salvo");
  render();
}

async function bulkSetStatus(status){
  const ids = [...selected];
  if(!ids.length) return;
  const { error } = await sb.from("notas_fiscais")
    .update({ status_manual: status, atualizado_em: new Date().toISOString() })
    .in("id", ids);
  if(error){ toast("Erro: " + error.message); return; }
  notas.forEach(n => { if(ids.includes(n.id)) n.status_manual = status; });
  selected.clear();
  toast(`${ids.length} nota(s) movida(s)`);
  render();
}

/* ============================================================
   COBRANÇA (mailto)
   ============================================================ */
function openCobrancaModal(){
  const ids = [...selected];
  const rows = notas.filter(n => ids.includes(n.id));
  const groups = {};
  const semComprador = [];

  rows.forEach(n => {
    const email = compradorEmail(n.possivel_comprador);
    if(!email){ semComprador.push(n); return; }
    groups[n.possivel_comprador] = groups[n.possivel_comprador] || { email, notas: [] };
    groups[n.possivel_comprador].notas.push(n);
  });

  const modal = document.getElementById("modalBody");
  const groupKeys = Object.keys(groups);

  modal.innerHTML = `
    <h3>Disparar e-mail de cobrança</h3>
    <p class="sub">Um e-mail será aberto por comprador, com cópia pra compras e financeiro.</p>
    ${groupKeys.length ? groupKeys.map(nome => `
      <div class="maillink">
        <div>
          <div class="who2">${nome}</div>
          <div class="cnt">${groups[nome].notas.length} nota(s) · ${groups[nome].email}</div>
        </div>
        <a class="btn small primary" href="${buildMailto(groups[nome].email, groups[nome].notas)}">Abrir e-mail</a>
      </div>
    `).join("") : `<p style="color:var(--text-dim); font-size:13px">Nenhuma nota selecionada tem um comprador com e-mail cadastrado.</p>`}
    ${semComprador.length ? `
      <p style="font-size:12.5px; color:var(--text-dim); margin-top:14px">
        ${semComprador.length} nota(s) selecionada(s) sem "possível comprador" definido — atribua um comprador na tabela antes de cobrar.
      </p>` : ""}
    <div style="text-align:right; margin-top:16px">
      <button class="btn" id="closeModal">Fechar</button>
    </div>
  `;
  document.getElementById("closeModal").onclick = closeModal;
  document.getElementById("modalBg").classList.add("show");
}

function buildMailto(to, rows){
  const subject = `Cobrança de identificação – ${rows.length} nota(s) fiscal(is) pendente(s)`;
  const linhas = rows.map(n =>
    `• NF ${n.numero_nf} — ${n.fornecedor || "fornecedor não identificado"} — emitida em ${fmtData(n.data_emissao)} — ${fmtMoeda(n.valor_total)}`
  ).join("\n");
  const body = `Olá,\n\nAs notas fiscais abaixo estão pendentes de identificação/tratamento:\n\n${linhas}\n\nPor favor, verificar e retornar o quanto antes.\n\nObrigado.`;
  const params = new URLSearchParams({ subject, body, cc: CC_EMAILS.join(",") });
  return `mailto:${encodeURIComponent(to)}?${params.toString()}`;
}

function closeModal(){ document.getElementById("modalBg").classList.remove("show"); }
document.getElementById("modalBg").addEventListener("click", (e) => { if(e.target.id === "modalBg") closeModal(); });
</script>
